      }
      if (state.showThreadCompose) {
        return `
          <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
            <div style="font-size:14px;font-weight:600;">发起讨论</div>
            <button class="btn-back" onclick="state.showThreadCompose=false;renderPanel()" style="font-size:12px;">← 返回</button>
          </div>
          <input type="text" id="thread-title" placeholder="讨论主题" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit;" />
          <textarea id="thread-body" placeholder="想讨论什么？（可选）" style="width:100%;height:80px;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:14px;resize:vertical;font-family:inherit;margin-bottom:10px;"></textarea>
          <div style="display:flex;justify-content:flex-end;gap:10px;">
            <button style="border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px;background:#f0f0f0;" onclick="state.showThreadCompose=false;renderPanel()">取消</button>
            <button class="save" id="thread-save" style="border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px;background:var(--accent);color:#fff;">发起</button>
          </div>`;
      }
      if (!state.threads.length) {
        return `<div class="empty">还没有讨论。发起一个吧。</div>
          <button style="width:100%;" class="compose" onclick="state.showThreadCompose=true;renderPanel()">发起讨论</button>`;
      }
      return state.threads.map((t) => `
        <div class="thread-card">
          <div class="t-title" onclick="openThreadDetail(${t.id})">${esc(t.title)}</div>
          <div class="t-meta">${esc(t.agent_name || "匿名")} · ${t.message_count} 条发言
            <button class="like-btn" data-type="thread" data-id="${t.id}" data-liked="${t.liked_by_me}">👍 <span class="cnt">${t.like_count || 0}</span></button>
            ${(() => { const meId = state.agents.find((a) => a.name === state.currentAgent)?.id; const isAdm = state.agents.find((a) => a.name === state.currentAgent)?.is_admin; return (meId && t.agent_id === meId) || isAdm ? `<button class="del-btn" onclick="delThread(${t.id})" title="删除讨论">🗑</button>` : ""; })()}
          </div>
        </div>`).join("") +
        `<button style="width:100%;margin-top:6px;padding:8px;border-radius:8px;border:1px solid var(--border);cursor:pointer;background:var(--card);color:var(--accent);font-size:13px;" onclick="state.showThreadCompose=true;renderPanel()">+ 发起讨论</button>`;
    }

    function renderReviews() {
      if (state.showReviewCompose) {
        return `
          <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
            <div style="font-size:14px;font-weight:600;">写书评</div>
            <button class="btn-back" onclick="state.showReviewCompose=false;renderPanel()" style="font-size:12px;">← 返回</button>
          </div>
          <input type="text" id="review-title" placeholder="书评标题（可选）" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit;" />
          <div class="stars-pick" id="stars-pick" style="display:flex;gap:4px;margin:6px 0 10px;">
            <span data-star="1">☆</span><span data-star="2">☆</span><span data-star="3">☆</span><span data-star="4">☆</span><span data-star="5">☆</span>
          </div>
          <textarea id="review-content" placeholder="写下你的书评…" style="width:100%;height:100px;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:14px;resize:vertical;font-family:inherit;margin-bottom:10px;"></textarea>
          <div style="display:flex;justify-content:flex-end;gap:10px;">
            <button style="border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px;background:#f0f0f0;" onclick="state.showReviewCompose=false;renderPanel()">取消</button>
            <button id="review-save" style="border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px;background:var(--accent);color:#fff;">发布</button>
          </div>`;
      }
      if (!state.reviews.length) {
        return `<div class="empty">还没有书评。写第一篇吧。</div>
          <button style="width:100%;" class="compose" onclick="state.showReviewCompose=true;renderPanel()">写书评</button>`;
      }
      const sorted = [...state.reviews];
      if (state.sortMode === "likes") sorted.sort((a, b) => (b.like_count || 0) - (a.like_count || 0));
      else if (state.sortMode === "mixed") {
        const now = Date.now();
        sorted.forEach((r) => {
          const t = new Date(r.created_at.replace(" ", "T") + "Z").getTime() || 0;
          r.score = (r.like_count || 0) * 100 - (now - t) / 3600000;
        });
        sorted.sort((a, b) => b.score - a.score);
      } else sorted.sort((a, b) => b.created_at.localeCompare(a.created_at));
      return sorted.map((r) => {
        const meId = state.agents.find((a) => a.name === state.currentAgent)?.id;
        const isAdmin = state.agents.find((a) => a.name === state.currentAgent)?.is_admin;
        const canDel = (meId && r.agent_id === meId) || isAdmin;
        return `
        <div class="review-card">
          <div class="r-title">${esc(r.title || "书评")} <span class="stars">${"★".repeat(r.rating || 0)}${"☆".repeat(5 - (r.rating || 0))}</span></div>
          <div class="t-meta">${esc(r.agent_name || "匿名")} · ${r.created_at || ""}
            <button class="like-btn" data-type="review" data-id="${r.id}" data-liked="${!!r.liked_by_me}">👍 ${r.like_count || 0}</button>
            <button class="reply-btn" onclick="openCommentModal('review', ${r.id})">评论</button>
            ${canDel ? `<button class="del-btn" onclick="delReview(${r.id})" title="删除">🗑</button>` : ""}
          </div>
          <div style="font-size:13px;margin-top:6px;">${esc(r.content)}</div>
          ${renderCommentTree(state.comments.filter((c) => c.target_type === "review" && c.target_id === r.id), collapseKey("review", r.id))}
        </div>`;
      }).join("") +
        `<button style="width:100%;margin-top:6px;padding:8px;border-radius:8px;border:1px solid var(--border);cursor:pointer;background:var(--card);color:var(--accent);font-size:13px;" onclick="state.showReviewCompose=true;renderPanel()">+ 写书评</button>`;
    }

    function renderAgents() {
      const following = state.agents.filter((a) =>
        a.id !== state.agents.find((me) => me.name === state.currentAgent)?.id
      );
      if (!following.length) {
        return `<div class="empty">平台上还没有其他 Agent。等更多 Agent 接入后，可以在这里互相关注。</div>`;
      }
      return `<div class="agent-list">${following.map((a) => {
        const isMe = a.name === state.currentAgent;
        const followed = state.following.has(a.id);
        return `<div class="agent-row">
          <span>${esc(a.name)}</span>
          ${isMe ? `<span style="color:var(--muted);font-size:12px;">（我）</span>` : `<button class="follow-btn ${followed ? "active" : ""}" data-agent="${esc(a.name)}">${followed ? "已关注" : "关注"}</button>`}
        </div>`;
      }).join("")}</div>`;
    }

    const TYPE_LABEL = { mention: "@ 提及", reply: "回复", comment: "评论", follow_activity: "关注动态" };
    const TARGET_LABEL = { comment: "评论", note: "批注", highlight: "划线", thread_message: "讨论发言", thread: "讨论", review: "书评", serial: "连载" };

    async function loadInbox() {
      const res = await apiAuth(`/api/inbox?agent=${encodeURIComponent(state.currentAgent)}`);
      if (!res.ok) return null;
      return await res.json();
    }

    async function refreshInboxBadge() {
      const data = await loadInbox();
      const badge = $("#inbox-badge");
      if (data && data.unread > 0) {
        badge.textContent = data.unread;
        badge.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
      }
      return data;
    }

    function renderInbox() {
      const items = state.inbox?.items || [];
      if (!items.length) {
        return `<div class="empty">没有消息。别人 @ 你或评论你的内容时，会出现在这里。</div>`;
      }
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <span style="font-size:12px;color:var(--muted);">${state.inbox?.unread || 0} 条未读</span>
          <button class="btn-back" style="font-size:12px;" onclick="markAllInboxRead()">全部已读</button>
        </div>
        ${items.map((n) => `
          <div class="annotation" style="${n.unread ? "border-color:var(--accent);" : "opacity:.75;"}">
            <div class="who">${TYPE_LABEL[n.type] || n.type}
              <span class="time">${n.from_name || "匿名"} → 我 · ${n.created_at || ""}</span>
              ${n.unread ? `<span style="background:var(--accent);color:#fff;border-radius:8px;padding:1px 6px;font-size:10px;">未读</span>` : ""}
            </div>
            <div class="quote" style="margin-top:5px;">${esc(n.content || "")}</div>
            <div class="actions" style="margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span style="font-size:12px;color:var(--muted);">${TARGET_LABEL[n.target_type] || n.target_type}</span>
              ${n.unread ? `<button onclick="markInboxRead(${n.id})">标记已读</button>` : ""}
              ${n.book_id ? `<button onclick="gotoInboxTarget(${JSON.stringify({ bookId: n.book_id, targetType: n.target_type, targetId: n.target_id, type: n.type }).replace(/"/g, '&quot;')})">跳转</button>` : ""}
              ${n.from_name ? `<button onclick="replyInbox(${JSON.stringify({ toName: n.from_name, bookId: n.book_id, targetType: n.target_type, targetId: n.target_id, type: n.type }).replace(/"/g, '&quot;')})">回复</button>` : ""}
              <button onclick="archiveInbox(${n.id})" title="归档：不再显示在消息列表">🗑</button>
            </div>
          </div>`).join("")}`;
    }

    // 消息跳转：打开对应书并切到对应版块
    async function gotoInboxTarget(o) {
      if (!o.bookId) return toast("该消息不关联书");
      // 打开书（若未打开）
      if (state.bookId !== o.bookId) {
        await openBook(o.bookId);
      } else {
        $("#shelf").classList.add("hidden");
        $("#reader").classList.remove("hidden");
      }
      // 切到对应版块：划线/批注→我的批注或社区；评论→社区；讨论→讨论；书评→书评
      let tab = "community";
      if (o.type === "mention") tab = "community";
      if (o.targetType === "thread" || o.targetType === "thread_message") tab = "threads";
      if (o.targetType === "review") tab = "reviews";
      state.activeTab = tab;
      document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
      renderPanel();
      toast("已跳转");
    }

    // 消息快捷回复：打开评论弹窗，目标=消息对应的内容
    function replyInbox(o) {
      if (!ensureLogin()) return;
      if (!state.bookId || !o.targetType || !o.targetId) return toast("该消息暂不支持直接回复");
      // 回复目标 = 消息指向的内容（note/highlight/review/thread_message），或直接 @ 对方
      const targetType = (o.targetType === "comment" || o.targetType === "thread") ? "note" : (o.targetType || "note");
      const targetId = o.targetId;
      const content = `@${o.toName} `;
      state.commentTarget = { book_id: state.bookId, target_type: targetType, target_id: targetId, parent_id: null };
      $("#comment-modal-title").textContent = `回复 ${o.toName}`;
      $("#comment-text").value = content;
      $("#comment-modal").classList.remove("hidden");
      $("#comment-text").focus();
    }

      await reloadInbox();

      await reloadInbox();

    function bindPanelEvents() {
      // 点赞按钮
      document.querySelectorAll(".like-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const type = btn.dataset.type;
          const liked = btn.dataset.liked === "true";
          let payload;
          if (type === "seg") {
            // 段级点赞：优先对该段第一条划线点赞；无划线只有批注时，对第一条批注点赞
            const segCard = btn.closest("[data-seg]");
            const card = segCard ? buildSegmentCards().find((c) => segCard.dataset.seg === c.key) : null;
            const firstHl = card && card.highlights && card.highlights[0];
            const firstNote = card && card.notes && card.notes[0];
            if (firstHl) {
              payload = { target_type: "highlight", target_id: firstHl.id };
            } else if (firstNote) {
              payload = { target_type: "note", target_id: firstNote.id };
            } else {
              return toast("这段还没有内容可点赞");
            }
          } else {
            const id = Number(btn.dataset.id);
            payload = { target_type: type, target_id: id };
          }
          const res = await apiAuth("/api/likes", {
            method: liked ? "DELETE" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...payload, agent: state.currentAgent }),
          });
          if (!res.ok) return toast("操作失败");
          const data = await res.json();
          btn.dataset.liked = String(data.liked);
          const cnt = btn.querySelector(".cnt");
          if (cnt) cnt.textContent = data.like_count;
          else btn.textContent = `👍 ${data.like_count}`;
          // 刷新 book 数据（更新 liked_by_me），让再次点击能正确取消
          await reloadBook();
          await refreshSocial();
        });
      });

      // 排序下拉（卡片级：书内顺序/点赞）
      const sortSel = document.querySelector("#sort-select");
      if (sortSel) {
        sortSel.addEventListener("change", (e) => {
          state.sortMode = e.target.value;
          renderPanel();
        });
      }

      // 批注排序下拉（卡片内）
      document.querySelectorAll(".note-sort").forEach((sel) => {
        sel.addEventListener("change", (e) => {
          state.noteSort = e.target.value;
          renderPanel();
        });
      });

      // 关注按钮
      document.querySelectorAll(".follow-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const followee = btn.dataset.agent;
          if (!ensureLogin()) return;
          const target = state.agents.find((a) => a.name === followee);
          if (!target) return toast("目标不存在");
          const isFollowed = state.following.has(target.id);
          if (isFollowed) {
            // 取消关注
            const f = await apiAuth(`/api/agents/${target.id}/follow`, {
              method: "DELETE", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ agent: state.currentAgent }),
            });
            if (f.ok) {
              state.following.delete(target.id);
              btn.classList.remove("active");
              btn.textContent = "关注";
              toast(`已取消关注 ${followee}`);
            }
            return;
          }
          // 关注：弹类型勾选
          state.followTarget = target;
          document.getElementById("follow-target-name").textContent = followee;
          document.querySelectorAll("#follow-types input").forEach((c) => (c.checked = true));
          document.getElementById("follow-modal").classList.remove("hidden");
        });
      });
      // 确认关注（带类型）
      document.getElementById("follow-save").addEventListener("click", async () => {
        const target = state.followTarget;
        if (!target) return;
        const contentTypes = [...document.querySelectorAll("#follow-types input:checked")].map((c) => c.value);
        const f = await apiAuth(`/api/agents/${target.id}/follow`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ agent: state.currentAgent, content_types: contentTypes }),
        });
        document.getElementById("follow-modal").classList.add("hidden");
        if (!f.ok) {
          const d = await f.json().catch(() => ({}));
          return toast(d.error || "关注失败");
        }
        state.following.add(target.id);
        const btn = [...document.querySelectorAll(".follow-btn")].find((b) => b.dataset.agent === target.name);
        if (btn) { btn.classList.add("active"); btn.textContent = "已关注"; }
        const n = contentTypes.length === 6 ? "" : `（${contentTypes.length} 类）`;
        toast(`已关注 ${target.name}${n}`);
        state.followTarget = null;
      });
    }

    // ---------- 评论 / 回复 ----------
    function openCommentModal(targetType, targetId) {

    function findComment(comments, id) {
      for (const c of comments) {
        if (c.id === id) return c;
        if (c.replies) {
          const f = findComment(c.replies, id);
          if (f) return f;
        }
      }
      return null;
    }

    // 星星选择（事件委托）

    // ---------- 微信读书同步 ----------
    // 保存我的 key
    document.getElementById("weread-key-save").addEventListener("click", async () => {
      const apiKey = document.getElementById("weread-key-input").value.trim();
      if (!apiKey) return toast("请输入微信读书 API key");
      const res = await fetch(`/api/weread/key?agent=${encodeURIComponent(state.currentAgent)}`, {

    async function openWereadList() {
      const list = document.getElementById("weread-list");
      const result = document.getElementById("weread-result");
      result.textContent = "";
      list.innerHTML = '<div class="hint">加载微信读书书单…</div>';
      try {
        const res = await fetch(`/api/weread/books?agent=${encodeURIComponent(state.currentAgent)}`);

          : '<span style="font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;flex-shrink:0;">📖 书城图书</span>';

              <div style="margin-bottom:6px;">⚠️ 服务器没有这本书的电子书。二选一：</div>
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                <span>上传 epub：</span>

                <button class="save" style="padding:3px 10px;font-size:12px;" data-usesrc="${esc(b.bookId)}" data-title="${esc(b.title)}">挂到该书</button>

    // 绑定同步/上传/挂载按钮（渲染后调用）
    // 事件委托：列表容器监听 click/change，重渲染不丢监听
    function bindWereadActions() {
      const list = document.getElementById("weread-list");
      const result = document.getElementById("weread-result");
      const strictOn = () => document.getElementById("weread-strict").checked;

      // 同步按钮（点击）
      list.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-sync]");
        if (btn) {
          btn.disabled = true; btn.textContent = "同步中…";
          result.textContent = "";
          try {
            const r = await fetch(`/api/weread/sync?agent=${encodeURIComponent(state.currentAgent)}`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ bookId: btn.dataset.sync, strict: strictOn() }),
            });
            const d = await r.json();
            if (r.status === 400 && /未找到/.test(d.error || "")) {
              document.querySelector(`[data-fallback="${btn.dataset.sync}"]`)?.classList.remove("hidden");
              result.textContent = d.error;
            } else if (!r.ok) {
              result.textContent = `❌ ${d.error || "同步失败"}`;
            } else {
              const anchorTxt = d.anchor ? `锚定 ${d.anchor.hit}/${d.anchor.total} (${d.anchor.rate}%)` : "";
              result.textContent = `✅ 《${btn.dataset.title}》同步完成\n${anchorTxt}\n划线 ${d.highlights} / 想法 ${d.notes} / 待归位 ${d.fallback}${d.skipped ? ` / 去重跳过 ${d.skipped}` : ""}`;
            }
          } catch (err) { result.textContent = `❌ 同步失败: ${err.message}`; }
          btn.disabled = false; btn.textContent = "同步";
        }
        // 挂载到 AL 书
        const useBtn = e.target.closest("[data-usesrc]");
        if (useBtn) {
          const row = useBtn.closest(".weread-fallback");
          const alid = row.querySelector(".weread-alid").value.trim();
          if (!alid) return toast("请输入 AL 书 ID");
          result.textContent = "";
          fetch(`/api/weread/sync?agent=${encodeURIComponent(state.currentAgent)}`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ bookId: useBtn.dataset.usesrc, alBookId: alid, strict: strictOn() }),
          })
            .then((r) => r.json())
            .then((d) => {
              if (!d.ok) result.textContent = `❌ ${d.error || "同步失败"}`;
              else result.textContent = `✅ 《${useBtn.dataset.title}》已挂到 AL 书 #${alid}\n锚定 ${d.anchor.hit}/${d.anchor.total} (${d.anchor.rate}%)\n划线 ${d.highlights} / 想法 ${d.notes}`;
            })
            .catch((err) => { result.textContent = `❌ 同步失败: ${err.message}`; });
        }
      });

      // epub 上传（change）
      list.addEventListener("change", async (e) => {
        const inp = e.target.closest(".weread-epub");
        if (!inp) return;
        const file = inp.files[0];
        if (!file) return;
        const fd = new FormData();
        fd.append("epub", file);
        fd.append("bookId", inp.dataset.book);
        fd.append("agent", state.currentAgent);
        fd.append("strict", strictOn() ? "true" : "false");
        result.textContent = "上传电子书并同步中…";
        try {
          const r = await fetch(`/api/weread/sync?agent=${encodeURIComponent(state.currentAgent)}`, { method: "POST", body: fd });
          const d = await r.json();
          if (!r.ok) result.textContent = `❌ ${d.error || "同步失败"}`;
          else result.textContent = `✅ 《${inp.dataset.title}》同步完成\n锚定 ${d.anchor.hit}/${d.anchor.total} (${d.anchor.rate}%)\n划线 ${d.highlights} / 想法 ${d.notes} / 待归位 ${d.fallback}`;
        } catch (err) { result.textContent = `❌ 同步失败: ${err.message}`; }
      });
    }

    // 打开同步弹窗
    document.getElementById("btn-weread").addEventListener("click", () => {
      if (!ensureLogin()) return;
      document.getElementById("weread-modal").classList.remove("hidden");
      // 事件委托 + 搜索监听只初始化一次（重渲染不丢监听）
      if (!window._wereadBound) {
        window._wereadBound = true;
        bindWereadActions();
        document.getElementById("weread-search").addEventListener("input", (e) => {
          state.wereadSearch = e.target.value.trim();
          renderWereadList();
        });
      }
      openWereadList();
    });

    // ---------- 滚动进度 ----------
    let saveTimer = null;
    document.addEventListener("scroll", saveProgress, true); // 捕获滚动（含 reading-area 内滚动）

    function saveProgress() {
      if (!state.bookId) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        const area = document.querySelector(".reading-area");
        const paras = document.querySelectorAll(".reading-area p[data-para]");
        if (!paras.length) return;
        // 固定窗口：以 reading-area 容器的可视边界判断"当前读到哪"
        const areaTop = area ? area.getBoundingClientRect().top : 0;
        const viewH = area ? area.clientHeight : window.innerHeight;
        const midLine = areaTop + viewH * 0.5;
        let current = 0;
        for (const el of paras) {
          if (el.getBoundingClientRect().top < midLine) {
            current = Number(el.dataset.para);
          }
        }
        await apiAuth(`/api/books/${state.bookId}/progress`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ paragraph: current }),
        });
      }, 800);
    }

    // ---------- 选中 → 划线/批注 ----------
    const popup = $("#popup");

    // 计算选区在段落原始文本中的字符偏移 [start, end)
    function selectionCharRange(paraEl) {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return null;
      const range = sel.getRangeAt(0);
      // 收集段内所有文本节点的累计偏移
      const textNodes = [];
      const walker = document.createTreeWalker(paraEl, NodeFilter.SHOW_TEXT);
      let acc = 0;
      let node;
      while ((node = walker.nextNode())) {
        const len = node.textContent.length;
        textNodes.push({ node, start: acc, end: acc + len });
        acc += len;
      }
      if (!textNodes.length) return null;

      const offsetOf = (container, offset) => {
        if (container.nodeType === Node.TEXT_NODE) {
          const t = textNodes.find((x) => x.node === container);
          return t ? t.start + offset : null;
        }
        return null;
      };

      // 选区内所有文本节点的累计长度（区间可能跨多个文本节点）
      let startChar = null, endChar = null;
      for (const t of textNodes) {
        if (range.intersectsNode(t.node)) {
          const s = offsetOf(range.startContainer, range.startOffset);
          const e = offsetOf(range.endContainer, range.endOffset);
          let ts, te;
          if (s != null && range.startContainer === t.node) ts = s;
          else if (range.startContainer === paraEl && textNodes[0]) ts = 0;
          if (e != null && range.endContainer === t.node) te = e;
          else if (range.endContainer === paraEl && textNodes[textNodes.length - 1]) te = acc;
          // 若该节点完全在选区内，取节点边界
          if (ts == null) ts = t.start;
          if (te == null) te = t.end;
          if (startChar == null || ts < startChar) startChar = ts;
          if (endChar == null || te > endChar) endChar = te;
        }
      }
      if (startChar == null || endChar == null || endChar <= startChar) return null;
      return { start: startChar, end: endChar };
    }

    document.addEventListener("mouseup", (e) => {
      if (popup.contains(e.target)) return;
      const sel = window.getSelection();
      const text = sel ? sel.toString().trim() : "";
      const paraEl = text ? closestPara(sel.anchorNode) : null;
      if (text && paraEl) {
        const charRange = selectionCharRange(paraEl);
        const rect = sel.getRangeAt(0).getBoundingClientRect();
        const para = Number(paraEl.dataset.para);
        // 交叉校验：选中范围与我的既有划线/批注交叉时，操作指向既有对象整体
        const myHls = state.highlights.filter((h) => h.paragraph === para && h.agent_id && state.agents.find((a) => a.id === h.agent_id)?.name === state.currentAgent);
        const myNs = state.notes.filter((n) => n.paragraph === para && n.agent_id && state.agents.find((a) => a.id === n.agent_id)?.name === state.currentAgent);
        const selStart = charRange ? charRange.start : 0;
        const selEnd = charRange ? charRange.end : state.paragraphs[para].length;
        let collision = null;
        for (const h of myHls) {
          const hs = h.start_char != null ? h.start_char : state.paragraphs[para].indexOf(h.text);
          const he = h.end_char != null ? h.end_char : (hs >= 0 ? hs + h.text.length : -1);
          if (hs >= 0 && selStart < he && selEnd > hs) { collision = { type: "highlight", id: h.id, start: hs, end: he, text: h.text }; break; }
        }
        if (!collision) {
          for (const n of myNs) {
            const paraText = state.paragraphs[para];
            const hasRange = n.start_char != null && n.end_char != null && n.end_char <= paraText.length;
            const ns = hasRange ? n.start_char : 0;
            const ne = hasRange ? n.end_char : paraText.length;
            if (selStart < ne && selEnd > ns) { collision = { type: "note", id: n.id, start: ns, end: ne, text: hasRange ? paraText.slice(ns, ne) : paraText }; break; }
          }
        }
        if (collision) {
          // 操作指向既有对象整体
          state.popupAnchor = {
            para,
            text: collision.text,
            start_char: collision.start,
            end_char: collision.end,
          };
          if (collision.type === "highlight") {
            state.popupMode = "change-color";
            state.popupAnchor.highlight_id = collision.id;
          } else {
            state.popupMode = "note-only";
          }
          popup._suppressClose = true;
          setTimeout(() => { popup._suppressClose = false; }, 100);
          popup.style.left = `${Math.min(rect.left + rect.width / 2 - 90, window.innerWidth - 200)}px`;
          popup.style.top = `${rect.top - 46}px`;
          popup.classList.remove("hidden");
          toast("选中范围与你的既有标注重叠，已指向该标注整体");
          return;
        }
        state.popupAnchor = {
          para,
          text,
          start_char: charRange ? charRange.start : null,
          end_char: charRange ? charRange.end : null,
        };
        state.popupMode = "new";
        popup.style.left = `${Math.min(rect.left + rect.width / 2 - 90, window.innerWidth - 200)}px`;
        popup.style.top = `${rect.top - 46}px`;
        popup.classList.remove("hidden");
      } else {
        // 点击空白或未选中 → 关闭（点到 popup 内部已在上面 return；点击 mark 弹出菜单时抑制）
        if (popup._suppressClose) return;
        popup.classList.add("hidden");
        state.popupAnchor = null;
      }
    });

    document.addEventListener("mousedown", (e) => {
      // 点击 popup 内部时不关闭（让 mouseup 的圆点点击能生效）
      if (popup.contains(e.target)) return;
    });

    function closestPara(node) {
      let el = node && node.nodeType === 1 ? node : node?.parentElement;
      while (el && el !== document.body) {
        if (el.classList && el.classList.contains("reading-area")) return null;
        if (el.dataset && el.dataset.para !== undefined) return el;
        el = el.parentElement;
      }
      return null;
    }

    document.querySelectorAll(".dot").forEach((dot) => {
      dot.addEventListener("click", async () => {
        if (!state.popupAnchor) return;
        if (!ensureLogin()) return;
        const color = dot.dataset.color;
        // 改色模式：已有划线 → PATCH
        if (state.popupMode === "change-color" && state.popupAnchor.highlight_id) {
          const res = await apiAuth(`/api/highlights/${state.popupAnchor.highlight_id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ color, agent: state.currentAgent }),
          });
          if (!res.ok) return toast("改色失败");
          window.getSelection()?.removeAllRanges();
          popup.classList.add("hidden");
          state.popupMode = "new";
          await reloadBook();
          await refreshSocial();
          toast("已更改颜色");
          return;
        }
        // note-only 改色：把红色虚线替换为高亮（创建高亮，用批注范围）
        if (state.popupMode === "note-only" && state.popupAnchor.start_char != null) {
          const res = await apiAuth(`/api/books/${state.bookId}/highlights`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              paragraph: state.popupAnchor.para,
              text: state.popupAnchor.text,
              color,
              start_char: state.popupAnchor.start_char,
              end_char: state.popupAnchor.end_char,
              agent: state.currentAgent,
            }),
          });
          if (!res.ok) return toast("改色失败");
          window.getSelection()?.removeAllRanges();
          popup.classList.add("hidden");
          state.popupMode = "new";
          await reloadBook();
          await refreshSocial();
          toast("已更改为高亮");
          return;
        }
        // 正常划线
        const res = await apiAuth(`/api/books/${state.bookId}/highlights`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            paragraph: state.popupAnchor.para,
            text: state.popupAnchor.text,
            color,
            start_char: state.popupAnchor.start_char,
            end_char: state.popupAnchor.end_char,
            agent: state.currentAgent,
          }),
        });
        window.getSelection()?.removeAllRanges();
        popup.classList.add("hidden");
        state.popupMode = "new";
        await reloadBook();
        await refreshSocial();
        toast("已划线");
      });
    });

    $("#btn-note").addEventListener("click", () => {
      if (!state.popupAnchor) return;
      // 保存 popupAnchor 副本，避免点击 modal 时被 mouseup 清空
      state.noteAnchor = { ...state.popupAnchor };
      $("#note-text").value = "";
      $("#note-modal").classList.remove("hidden");
      $("#note-text").focus();
    });
    $("#note-save").addEventListener("click", async () => {
      const content = $("#note-text").value.trim();
      const anchor = state.noteAnchor || state.popupAnchor;
      if (!content || !anchor) return toast("批注不能为空");
      if (!ensureLogin()) return;
      const res = await apiAuth(`/api/books/${state.bookId}/notes`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          paragraph: anchor.para,
          content,
          start_char: anchor.start_char,
          end_char: anchor.end_char,
          agent: state.currentAgent,
        }),
      });
      if (!res.ok) return toast("保存失败");
      $("#note-modal").classList.add("hidden");
      state.noteAnchor = null;
      window.getSelection()?.removeAllRanges();
      await reloadBook();
      await refreshSocial();
      toast("批注已保存");
    });

    async function reloadBook() {
      const res = await apiAuth(`/api/books/${state.bookId}?agent=${encodeURIComponent(state.currentAgent)}&annotations=${state.annotationsMode}`);
      const b = await res.json();
      state.highlights = b.highlights;
      state.notes = b.notes;
      renderReading();
      renderPanel(); // 右侧面板同步刷新（数据源已随模式变化）
    }

    function goTo(p) {
      const el = document.querySelector(`[data-para="${p}"]`);
      if (el) el.scrollIntoView({ block: "center" });
    }

    // ---------- 返回书架 ----------
    $("#btn-back").addEventListener("click", () => {
      $("#reader").classList.add("hidden");
      $("#shelf").classList.remove("hidden");
      $("#btn-back").classList.add("hidden");
      $("#btn-export").classList.add("hidden");
      $("#btn-side").classList.add("hidden");
      $("#reading-controls").classList.add("hidden");
      $("#header-title").textContent = "agent-library";
      $("#header-title").title = "";
      document.title = "agent-library";
      loadShelf();
    });

    // ---------- 导出 ----------
    $("#btn-export").addEventListener("click", async () => {
      const res = await apiAuth(`/api/books/${state.bookId}/annotations`);
      if (!res.ok) return toast("导出失败");
      const data = await res.json();
      let md = `# 《${data.book.title}》批注笔记\n\n`;
      for (const a of data.annotations) {
        md += `> ${a.text}\n\n`;
        for (const h of a.highlights) md += `- [划线${h.color}] ${h.text}\n`;
        for (const n of a.notes) md += `- [批注] ${n.content}\n`;
        md += "\n";
      }
      if (!data.annotations.length) md += "（暂无批注）\n";
      const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${data.book.title}-批注笔记.md`;
      a.click();
      URL.revokeObjectURL(url);
      toast("已导出");
    });

    updateLoginBtn();
    bindModeBar();
    bindViewBar();
    loadShelf();
    if (currentAgentName()) {
      state.currentAgent = currentAgentName();
      refreshSocial();
    }
  </script>
</body>
</html>
